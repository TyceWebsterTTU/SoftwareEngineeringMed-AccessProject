<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-Access Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #live-terminal {
            background-color: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <div id="DashboardView">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Med-Access Dashboard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarColor01">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Calls</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Units Available</a></li>
                    </ul>
                    <button id="btnLogout" class="btn btn-outline-light" type="button" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-md-4">
                    <div class="card bg-secondary text-white mb-4">
                        <div class="card-header">Hardware Status</div>
                        <div class="card-body text-center">
                            <p id="serial-status" class="badge bg-danger fs-6">Disconnected</p>
                            <div class="d-grid gap-2">
                                <button id="connect-btn" class="btn btn-warning fw-bold">🔌 Connect to ESP32</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card bg-secondary text-white mb-4">
                        <div class="card-header d-flex justify-content-between">
                            <span>System Event Log</span>
                            <small class="text-info">Raw data from ESP32</small>
                        </div>
                        <div id="live-terminal" class="card-body">
                            <div>> System ready. Awaiting hardware connection...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card bg-secondary text-white">
                <div class="card-header">Logged Activity (Database)</div>
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboardFunc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Start looking for calls immediately after login
    startDispatchPolling();
    </script>
    <script>
        // Load initial data from database
        loadTestData();
    </script>
</body>
</html>
