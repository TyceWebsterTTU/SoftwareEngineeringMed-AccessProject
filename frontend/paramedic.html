<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-Access Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="#">

    <style>
        #live-terminal {
            background-color: #1a1a1a;
            color:  #00ff00;
            font-family: 'Courier New', Courier, monospace;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <div id="globalAlertPlaceholder" style="
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        pointer-events: none; /* Allows clicking 'through' the empty space */
        z-index: 20000;">
    </div>
        <nav class="navbar navbar-expand-lg bg-primary shadow py-0 my-0" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center py-0 my-0" href="#">
                <img src="Images/Med_Access_Logo_NoRing.svg" 
                    alt="Logo" 
                    height="75" 
                    class="me-2" 
                    style="filter: drop-shadow(0 0 2px white) drop-shadow(0 0 2px white);
            image-rendering: -webkit-optimize-contrast;
            vertical-align: middle;"> <span class="fw-bold">Med-Access Admin</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a id="nav-Home" class="nav-link active" href="#" onclick="showSection('Home')">Home</a>
                    </li>
                    <li class="nav-item">
                        <a id="nav-Parameds" class="nav-link" href="#" onclick="showSection('Parameds')">Paramedics</a>
                    </li>
                </ul>


                <div class="nav-item dropdown">
                    <div class="nav-item dropdown w-100">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false"><i class="bi bi-person-circle"></i><span id="displayUsername"></span></a>
                    <div class="dropdown-menu dropdown-menu-end bg-secondary border-white mt-1 p-3">
                        <h6 id="displayRole">Role: </h6>
                        <h6 id="displayAmbulance">Ambulance: </h6>
                        <div class="dropdown-divider"></div>
                            <div class="text-center">
                                <button id="btnLogout" class="btn btn-outline-light justify-content-center" type="button" onclick="logout()">Logout</button>  
                            </div>
                        </div>
                </div>
               
            </div>
        </div>
    </nav>

    
    <div id="content-area">
        <div id="section-Home" class="container-fluid py-4">    
            <div class="container-fluid mt-4">
                <div class="row align-items-stretch">
                    <div class="col-md-4">
                        <div class="card bg-secondary text-white mb-4">
                            <div class="card-header">Hardware Status</div>
                                <div class="card-body text-center">
                                    <p id="serial-status" class="badge bg-danger fs-6">Disconnected</p>
                                    <div class="d-grid gap-2">
                                        <button id="connect-btn" class="btn btn-warning fw-bold">Connect to ESP32</button>
                                    </div>
                                </div>
                        </div>
                        <div class="card bg-secondary text-white mb-4">
                            <div class="card-header d-flex justify-content-center align-items-center gap-2">
                                <!--Incident Status: -->
                                <span id="bdgCallStatusActive" class="badge bg-danger" style="display:none">Actively on Call</span>
                                <span id="bdgCallStatusInactive" class="badge bg-success" style="display:none">Not on Call</span>
                            </div>
                            <div class="card-body text-center">
                                <label class="form-label" for="txtUnitID">Unit ID</label>
                                <input class="form-control" id="txtUnitID" type="text">
                                <label class="form-label" for="txtCaseID">Case ID</label>
                                <input class="form-control" id="txtCaseID" type="text">
                                <div class="d-grid gap-2 mt-3">
                                    <button id="cancelBtn" class="btn btn-danger fw-bold" onclick="sendCallStatusToDispatch()">Incident Responded - Alert Dispatch to Clear Call</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-8 d-flex">
                        <div class="card bg-secondary text-white mb-4 flex-fill">
                            <div class="card-header d-flex justify-content-between">
                                <span>System Event Log</span>
                                <small class="text-info">Raw data from ESP32</small>
                            </div>
                            <div id="live-terminal" class="card-body">
                                <div>> System ready. Awaiting hardware connection...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card bg-secondary text-white">
                    <div class="card-header">Logged Activity (Database)</div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover mb-0">
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-Parameds"class="container-fluid py-4" style="display:none;">
            <h1>All paramedics connected to esp</h1>
            <div class="row justify-content-center mb-5">
            <div class="col-12 col-xl-10">
                <div class="table-responsive shadow rounded-3 overflow-hidden border bg-white text-dark">
                    <table class="table table-hover table-bordered align-middle text-center mb-0 bg-white table-striped" id="tblParameds">
                        <thead class="text-center">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Ambulance</th>
                            </tr>
                        </thead>
                        <tbody id="paramedsBody"></tbody>
                    </table>
                </div>
            </div>
            </div>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.min.js"></script>
    <script src="functions/paramedicFunc.js"></script>

    <script>
    // Start looking for calls immediately after login
    </script>
    <script>
        // Load initial data from database
        //loadTestData();

        function showSection(sectionId) {
            const sections = ['Home', 'Parameds'];

            sections.forEach(s => {
                const sectionEl = document.getElementById(`section-${s}`);
                const navEl = document.getElementById(`nav-${s}`);

                if (s === sectionId) {
                    // 1. Show the clicked section
                    if (sectionEl) sectionEl.style.display = 'block';
                    if (navEl) navEl.classList.add('active');

                    // 2. Load the specific data for this section
                    // We use sectionId here to ensure it only loads once per click
                    if (s === 'Parameds') {
                        LoadUserData();
                    }
                    
                } else {
                    // 3. Hide the other sections
                    if (sectionEl) sectionEl.style.display = 'none';
                    if (navEl) navEl.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
