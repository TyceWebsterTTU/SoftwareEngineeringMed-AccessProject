    <script>
        // Load initial data from database
        //loadTestData();

        function showSection(sectionId) {
            const sections = ['Home', 'Calls', 'Units', 'Parameds'];

            sections.forEach(s => {
                const sectionEl = document.getElementById(`section-${s}`);
                const navEl = document.getElementById(`nav-${s}`);

                if (s === sectionId) {
                    // 1. Show the clicked section
                    if (sectionEl) sectionEl.style.display = 'block';
                    if (navEl) navEl.classList.add('active');

                    // 2. Load the specific data for this section
                    // We use sectionId here to ensure it only loads once per click
                    if (s === 'Parameds') {
                        LoadUserData();
                    }
                    if(s === 'Units'){
                        LoadAmbulanceData();
                    }
                } else {
                    // 3. Hide the other sections
                    if (sectionEl) sectionEl.style.display = 'none';
                    if (navEl) navEl.classList.remove('active');
                }
            });
        }
    
    </script>
