<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-Access Dispatcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #live-terminal {
            background-color: #1a1a1a;
            color:  #00ff00;
            font-family: 'Courier New', Courier, monospace;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Med-Access Dispatcher</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="#" onclick="showSection('Home')">Home</a><span class="visually-hidden">(current)</span></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('Calls')">Calls</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('Units')">Units Available</a></li>
                </ul>
                <button id="btnLogout" class="btn btn-outline-light" type="button" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    
    <div id="content-area">
        <div id="section-Home" class="container-fluid py-4">    
            <div class="container-fluid mt-4">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card bg-secondary text-white mb-4">
                            <div class="card-header">Hardware Status</div>
                                <div class="card-body text-center">
                                    <p id="serial-status" class="badge bg-danger fs-6">Disconnected</p>
                                    <div class="d-grid gap-2">
                                        <button id="connect-btn" class="btn btn-warning fw-bold">Connect to ESP32</button>
                                    </div>
                                </div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="card bg-secondary text-white mb-4">
                            <div class="card-header d-flex justify-content-between">
                                <span>System Event Log</span>
                                <small class="text-info">Raw data from ESP32</small>
                            </div>
                            <div id="live-terminal" class="card-body">
                                <div>> System ready. Awaiting hardware connection...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card bg-secondary text-white">
                    <div class="card-header">Logged Activity (Database)</div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover mb-0">
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-Calls" class="container-fluid py-4" style="display:none;">
            <h1>Calls</h1>
        </div>


        <div id="section-Units"class="container-fluid py-4" style="display:none;">
            <h1>Units</h1>

        </div>

    </div>
    <script src="dashboardFunc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Start looking for calls immediately after login
    startDispatchPolling();
    </script>
    <script>
        // Load initial data from database
        loadTestData();

        function showSection(sectionId){
            // 1. List of all possible sections
            const sections = ['Home', 'Calls', 'Units'];

            sections.forEach(s => {
                const sectionEl = document.getElementById(`section-${s}`);
                const navEl = document.getElementById(`nav-${s}`);

                if (s === sectionId) {
                    // Show the clicked section
                    sectionEl.style.display = 'block';
                    // Add the active highlight to the nav button
                    navEl.classList.add('active');

                    
                } else {
                    // Hide the others
                    sectionEl.style.display = 'none';
                    // Remove highlight from others
                    navEl.classList.remove('active');
                }
            
        });
    }
    </script>
</body>
</html>
