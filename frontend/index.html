<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-secondary">
    <div id="LoginView" class="d-flex justify-content-center align-items-center vh-100">
        <div class="card col-11 col-sm-8 col-md-5 col-lg-4 shadow-lg border-0 bg-light">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="Images/Med_Access_Logo.png" alt="Med-Access Logo" class="img-fluid w-75">
                </div>

                <form>
                    <div class="mb-3">
                        <label class="form-label" for="txtUsrName">Username</label>
                        <input class="form-control" id="txtUsrName" type="text">
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="txtPassword">Password</label>
                        <input class="form-control" id="txtPassword" type="password">
                    </div>

                    <button id="btnLogin" class="btn btn-primary btn-lg w-100 shadow-sm" type="button" onclick="login()">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script src="functions/indexFunc.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
